; Route calls into the Jev router, then fall through to a safe destination.
; Plain Asterisk: add to extensions.conf and send calls here with Goto(jev-router,s,1),
;   for example: exten => 8000,1,Goto(jev-router,s,1)
; FreePBX: paste into /etc/asterisk/extensions_custom.conf, point a Custom Destination at
;   jev-router,s,1, and change the fallback below to a FreePBX context such as
;   from-did-direct,100,1.

[jev-router]
exten => s,1,NoOp(Jev call routing for ${CALLERID(num)})
 same => n,Stasis(jev-router,line=main)
 same => n,NoOp(Jev router returned the call or was unavailable: ${STASISSTATUS})
 same => n,Goto(internal,100,1)
